<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕷️ Scrapi Web Console</title>
  
  <!-- Modern Google Fonts: Inter, Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration for custom animations & styling -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554'
            },
            dark: {
              50: '#f8fafc',
              800: '#0f172a',
              850: '#0b1120',
              900: '#070c18',
              950: '#030712'
            }
          },
          animation: {
            'pulse-slow': 'pulse 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'glow': 'glow 2.5s ease-in-out infinite alternate',
            'float': 'float 6s ease-in-out infinite',
            'fade-in': 'fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.98)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Custom Modern UI Styles -->
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Background Ambient Mesh */
    .ambient-bg {
      background: 
        radial-gradient(circle at 10% 0%, rgba(37, 99, 235, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
        #030712;
    }

    /* Modern Glassmorphic Panels */
    .glass {
      background: rgba(11, 17, 32, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    .glass-input {
      background: rgba(7, 12, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-input:focus {
      background: rgba(11, 18, 35, 0.95);
      border-color: rgba(59, 130, 246, 0.6);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18), inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    /* Luxury Button Design System */
    .btn-lux {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      border-radius: 0.75rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .btn-lux:hover:not(:disabled) {
      transform: translateY(-1.5px);
    }
    .btn-lux:active:not(:disabled) {
      transform: translateY(0.5px) scale(0.985);
    }

    .btn-primary-gradient {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #1e40af 100%);
      border: 1px solid rgba(96, 165, 250, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-primary-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
      box-shadow: 0 6px 20px 0 rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border-color: rgba(147, 197, 253, 0.6);
    }

    .btn-emerald-gradient {
      background: linear-gradient(135deg, #059669 0%, #047857 50%, #065f46 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(5, 150, 105, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-emerald-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
      box-shadow: 0 6px 20px 0 rgba(5, 150, 105, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border-color: rgba(110, 231, 183, 0.6);
    }

    .btn-purple-gradient {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 50%, #5b21b6 100%);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(124, 58, 237, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-purple-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 50%, #6d28d9 100%);
      box-shadow: 0 6px 20px 0 rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border-color: rgba(196, 181, 253, 0.6);
    }

    .btn-amber-gradient {
      background: linear-gradient(135deg, #d97706 0%, #b45309 50%, #92400e 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(217, 119, 6, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-amber-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      box-shadow: 0 6px 20px 0 rgba(217, 119, 6, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border-color: rgba(252, 211, 77, 0.6);
    }

    .btn-danger-gradient {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 50%, #991b1b 100%);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(220, 38, 38, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-danger-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
      box-shadow: 0 6px 20px 0 rgba(220, 38, 38, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      border-color: rgba(252, 165, 165, 0.6);
    }

    .btn-ghost-lux {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #cbd5e1;
    }
    .btn-ghost-lux:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Custom Smooth Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col ambient-bg">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- Compiled Application Script -->
  <script src="/app.js"></script>
</body>
</html>
